syntax = "proto3";
package inventory.v1;

option java_package = "edu.inventory.contracts.v1";
option java_multiple_files = true;

// Wire contract v2 (docs/thiet-ke.md, section 5). Business operations, replication, and node
// management are intentionally separate services.
//
// Implementation status: only NodeService.GetStatus is implemented. Every other RPC is part of
// the contract but currently returns UNIMPLEMENTED. Internal RPCs (ReplicationService,
// NodeService.UpdatePolicy, NodeService.Promote) will require "authorization: Bearer <token>"
// metadata (docs/thiet-ke.md, decision 7); the interceptor is not implemented yet.
//
// Removed fields are reserved: never reuse their numbers or names.
service InventoryService {
  rpc ExecuteCommand (CommandRequest) returns (CommandReply);              // primary only
  rpc GetInventory (InventoryQuery) returns (InventoryReply);              // any node
  rpc ListInventory (ListInventoryRequest) returns (ListInventoryReply);    // any node
}
service ReplicationService {
  rpc ApplyEvents (EventBatch) returns (ApplyReply);                       // token required
  rpc FetchEvents (FetchRequest) returns (FetchReply);                     // token required; replay only
}
service NodeService {
  rpc GetStatus (NodeStatusRequest) returns (NodeStatusReply);             // implemented
  rpc UpdatePolicy (PolicyUpdateRequest) returns (PolicyUpdateReply);      // token required; primary only
  rpc Promote (PromoteRequest) returns (PromoteReply);                     // token required
}

// Event types. 1..3 are business operations (accepted by ExecuteCommand and counted toward the
// S4 batch). 4..5 are system events: they only appear in ReplicationEvent, are never counted
// toward the S4 batch, and ExecuteCommand rejects them with INVALID_ARGUMENT.
enum OperationType {
  OPERATION_UNSPECIFIED = 0;
  CREATE_PRODUCT = 1;
  STOCK_IN = 2;
  STOCK_OUT = 3;
  POLICY_CHANGE = 4;
  EPOCH_START = 5;
}

enum PolicyType {
  POLICY_TYPE_UNSPECIFIED = 0;
  DELAY_SECONDS = 1; // S3 route, 0..3600 seconds
  BATCH_SIZE = 2;    // S4 route, 1..100 business events
}

message CommandRequest {
  reserved 6;
  reserved "voucher_no"; // generated by the primary since v2

  string request_id = 1; // UUID, stable across client retries
  OperationType operation = 2;
  string product_code = 3;
  string product_name = 4; // CREATE_PRODUCT only
  string unit = 5;         // CREATE_PRODUCT only
  int64 quantity = 7;      // STOCK_IN, STOCK_OUT only; > 0
}
message CommandReply {
  bool committed = 1;
  string event_id = 2;
  int64 epoch = 3;
  int64 seq = 4;
  string message = 5;
  string voucher_no = 6; // STOCK_IN: IN-<epoch>-<seq>; STOCK_OUT: OUT-<epoch>-<seq>
}

message InventoryQuery {
  string product_code = 1;
}
message InventoryReply {
  string product_code = 1;
  int64 quantity = 2;
  string node_id = 3;
  int64 epoch = 4;
  int64 last_applied_seq = 5;
  string product_name = 6;
  string unit = 7;
}
message ListInventoryRequest {}
message InventoryItem {
  string product_code = 1;
  string product_name = 2;
  string unit = 3;
  int64 quantity = 4;
}
message ListInventoryReply {
  repeated InventoryItem items = 1; // ascending product_code
  string node_id = 2;
  int64 epoch = 3;
  int64 last_applied_seq = 4;
}

// System event payloads; start_seq of an epoch is the seq of its EPOCH_START event.
message PolicyChange {
  PolicyType policy_type = 1;
  int32 new_value = 2;
  int64 configuration_version = 3;
}
message EpochStart {
  string primary_node_id = 1;   // node that became primary in this epoch
  string s4_source_node_id = 2; // fixed for the whole epoch (docs/thiet-ke.md, section 4)
}

// One committed event. Replicas forward event_id, epoch and seq unchanged.
message ReplicationEvent {
  reserved 10;
  reserved "event_hash";

  string event_id = 1;
  int64 epoch = 2; // epoch in which the event was committed; may be older than EventBatch.epoch
  int64 seq = 3;
  OperationType operation = 4;
  string product_code = 5;
  string product_name = 6;
  string unit = 7;
  string voucher_no = 8;
  int64 quantity = 9;
  string request_id = 11;   // client request_id (or admin_request_id); empty for EPOCH_START
  int32 schema_version = 12; // event payload version, currently 1
  PolicyChange policy_change = 13; // set only for POLICY_CHANGE
  EpochStart epoch_start = 14;     // set only for EPOCH_START
}
message EventBatch {
  string source_node_id = 1;
  string destination_node_id = 2;
  // Contiguous, ascending seq. S2/S3 routes: 1..100 events. S4 route: exactly one batch
  // (may exceed 100 when system events fall inside it), applied in one transaction.
  repeated ReplicationEvent events = 3;
  int64 epoch = 4; // sender's current epoch; the receiver checks this, not each event (decision 13)
}
enum ApplyCode {
  APPLY_CODE_UNSPECIFIED = 0;
  APPLIED = 1;      // ACK
  DUPLICATE = 2;    // ACK: already applied with the same content
  GAP_DETECTED = 3; // sender resends from last_applied_seq + 1
  STALE_EPOCH = 4;  // sender belongs to an older epoch
  CONFLICT = 5;     // same seq, different content; receiver becomes QUARANTINED
}
message ApplyReply {
  ApplyCode result = 1;
  int64 epoch = 2;            // receiver's current epoch
  int64 last_applied_seq = 3; // cumulative ACK
  string message = 4;
}

message FetchRequest {
  string requesting_node_id = 1;
  int64 epoch = 2;
  int64 after_seq = 3;
  int32 limit = 4; // 1..500
}
message FetchReply {
  reserved 2;
  reserved "snapshot_required";

  repeated ReplicationEvent events = 1;
  int64 high_watermark_seq = 3;
}

message NodeStatusRequest {}
message NodeStatusReply {
  string node_id = 1;
  string role = 2;   // PRIMARY or REPLICA, read from node_state
  int64 epoch = 3;
  int64 last_issued_seq = 4;
  int64 last_applied_seq = 5;
  string status = 6; // READY, QUARANTINED or RESTORING
}

message PolicyUpdateRequest {
  reserved 1;
  reserved "route_id";

  int32 new_value = 2;         // DELAY_SECONDS 0..3600, BATCH_SIZE 1..100
  string admin_request_id = 3; // UUID, stable across retries
  PolicyType policy_type = 4;
}
message PolicyUpdateReply {
  bool accepted = 1;
  int64 configuration_version = 2;
  string message = 3;
}

message PromoteRequest {
  int64 expected_epoch = 1; // epoch the operator saw; mismatch -> FAILED_PRECONDITION
}
message PromoteReply {
  string node_id = 1;
  int64 new_epoch = 2;
  int64 start_seq = 3;          // seq of the EPOCH_START event
  string s4_source_node_id = 4;
}
