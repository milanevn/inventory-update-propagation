name: Java CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same coordinates as the local TEST instance (scripts/local-pg.ps1 -Node TEST), so *IT tests need no CI-specific config.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: local_only_change_me
          POSTGRES_DB: inventory
        ports:
          - 5549:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit tests and integration tests (Maven Wrapper, pinned Maven version)
        run: ./mvnw -B -ntp verify
