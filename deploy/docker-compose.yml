name: inventory-replication-local
x-postgres-base: &postgres-base
  image: postgres:16
  environment:
    POSTGRES_USER: inventory
    POSTGRES_PASSWORD: local_only_change_me
    POSTGRES_DB: inventory
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
    interval: 3s
    timeout: 3s
    retries: 15
services:
  pg-s1:
    <<: *postgres-base
    ports: ["127.0.0.1:5541:5432"]
    volumes: ["pg_s1:/var/lib/postgresql/data"]
  pg-s2:
    <<: *postgres-base
    ports: ["127.0.0.1:5542:5432"]
    volumes: ["pg_s2:/var/lib/postgresql/data"]
  pg-s3:
    <<: *postgres-base
    ports: ["127.0.0.1:5543:5432"]
    volumes: ["pg_s3:/var/lib/postgresql/data"]
  pg-s4:
    <<: *postgres-base
    ports: ["127.0.0.1:5544:5432"]
    volumes: ["pg_s4:/var/lib/postgresql/data"]
  # Integration tests only (AbstractNodeIT); never used by S1..S4.
  pg-test:
    <<: *postgres-base
    ports: ["127.0.0.1:5549:5432"]
    volumes: ["pg_test:/var/lib/postgresql/data"]
volumes:
  pg_s1:
  pg_s2:
  pg_s3:
  pg_s4:
  pg_test:
